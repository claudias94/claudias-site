{% extends "base.html" %}
{% block title %}Admin sign in | {{ site_name }}{% endblock %}
{% block content %}
<section class="container page-head narrow">
  <h1>Admin sign in</h1>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form class="form" method="post" action="{{ url_for('admin.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required maxlength="64">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
